version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: monetchat-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: monetchat
      POSTGRES_USER: monet
      POSTGRES_PASSWORD: monetpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U monet -d monetchat" ]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: monetchat-qdrant-local
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data_local:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: monetchat-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data

volumes:
  postgres_data_local:
  qdrant_data_local:
  redis_data_local:


