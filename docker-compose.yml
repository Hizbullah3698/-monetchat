version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: Monetchat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: Monetchat
      POSTGRES_USER: Monetchatuser
      POSTGRES_PASSWORD: Monetchatpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: Monetchat_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: Monetchat_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Monetchat_app
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant
      - redis
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://Monetchatuser:Monetchatpassword@postgres:5432/Monetchat
      QDRANT_URL: http://qdrant:6333
      REDIS_HOST: redis
      REDIS_PORT: 6379

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: Monetchat_worker
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant
      - redis
    ports:
      - "4501:4501"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://Monetchatuser:Monetchatpassword@postgres:5432/Monetchat
      QDRANT_URL: http://qdrant:6333
      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
